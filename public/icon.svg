<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Internal Glow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Center Monogram: A + -->
  <g filter="url(#shadow)" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900">
    <!-- Letter A -->
    <path d="M 210 370 L 165 370 L 225 150 L 275 150 L 335 370 L 290 370 L 275 310 L 225 310 Z M 235 270 L 265 270 L 250 205 Z" fill="#ffffff"/>
    <!-- Plus symbol -->
    <path d="M 360 215 L 395 215 L 395 180 L 425 180 L 425 215 L 460 215 L 460 245 L 425 245 L 425 280 L 395 280 L 395 245 L 360 245 Z" fill="url(#plusGrad)"/>
  </g>
</svg>
